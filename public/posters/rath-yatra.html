<title>Amex Technology — Happy Rath Yatra</title>
<style>
  :root{
    --vermillion:#C1121F;
    --red-deep:#9E0E1A;
    --maroon:#6E0812;
    --marigold:#F6B21B;
    --gold-bright:#FFD34E;
    --gold-hi:#FFE9A8;
    --gold-deep:#B8760C;
    --ivory:#F2E7CE;
    --ink:#1E1712;
    --stage:min(1080px,92vmin);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:28px 16px 40px;
    background:
      radial-gradient(120% 120% at 50% 0%, #3a0509 0%, #240306 60%, #170203 100%);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }

  /* ---------- Poster stage ---------- */
  .poster{
    position:relative;
    width:var(--stage);
    aspect-ratio:1/1;
    container-type:size;
    overflow:hidden;
    border-radius:4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14cqmin 7cqmin 6.5cqmin;
    color:var(--ivory);
    background:
      radial-gradient(circle at 50% 41%, rgba(255,211,78,.28) 0%, rgba(193,18,31,0) 42%),
      radial-gradient(circle at 50% 44%, var(--vermillion) 0%, var(--red-deep) 52%, var(--maroon) 100%);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.7);
  }

  /* rotating sun rays behind everything */
  .rays{
    position:absolute; inset:-25%;
    z-index:0;
    background:repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,220,120,.16) 0deg 3.2deg,
      rgba(255,220,120,0) 3.2deg 9deg);
    -webkit-mask:radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 8%, #000 26%, rgba(0,0,0,.25) 70%, rgba(0,0,0,0) 84%);
            mask:radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 8%, #000 26%, rgba(0,0,0,.25) 70%, rgba(0,0,0,0) 84%);
    animation:spin 120s linear infinite;
    transform-origin:50% 44%;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* inner gold frame */
  .frame{
    position:absolute; inset:2.6cqmin;
    z-index:5; pointer-events:none;
    border:0.35cqmin solid rgba(255,211,78,.55);
    border-radius:2px;
    box-shadow:inset 0 0 0 0.7cqmin rgba(110,8,18,.55), inset 0 0 0 0.9cqmin rgba(255,211,78,.25);
  }
  .frame::before,.frame::after{
    content:""; position:absolute; width:2.4cqmin; height:2.4cqmin;
    border:0.4cqmin solid var(--gold-bright); transform:rotate(45deg);
    background:var(--maroon);
  }
  .frame::before{top:-1.2cqmin; left:calc(50% - 1.2cqmin);}
  .frame::after{bottom:-1.2cqmin; left:calc(50% - 1.2cqmin);}

  /* toran (marigold + leaf hanging) across the top */
  .toran{position:absolute; top:0; left:0; width:100%; z-index:4;}

  /* ---------- chariot ---------- */
  .scene{
    position:relative; z-index:2;
    flex:1; min-height:0; width:100%;
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 8px 18px rgba(60,2,6,.45));
  }
  .scene svg{height:100%; width:auto; max-width:100%; display:block;}
  .flag{transform-box:fill-box; transform-origin:0% 50%; animation:wave 4.5s ease-in-out infinite;}
  @keyframes wave{0%,100%{transform:rotate(-3deg) scaleX(.97);}50%{transform:rotate(4deg) scaleX(1.03);}}

  /* ---------- greeting ---------- */
  .words{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:1cqmin; text-align:center;}
  .eyebrow{
    font-size:3cqmin; letter-spacing:.62em; text-indent:.62em; font-weight:600;
    color:var(--gold-hi); text-transform:uppercase;
  }
  .title{
    font-family:"Bodoni 72","Bodoni 72 Oldstyle","Didot","Playfair Display",Georgia,"Times New Roman",serif;
    font-size:11.4cqmin; line-height:.92; font-weight:700; letter-spacing:.005em;
    text-wrap:balance;
    background:linear-gradient(178deg, var(--gold-hi) 4%, var(--gold-bright) 34%, var(--marigold) 58%, var(--gold-deep) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0.25cqmin 0.6cqmin rgba(70,3,7,.55);
    filter:drop-shadow(0 1px 0 rgba(120,70,6,.5));
  }
  .deva{
    font-family:"Kohinoor Devanagari","Devanagari Sangam MN","Noto Sans Devanagari","Nirmala UI",sans-serif;
    font-size:4.4cqmin; color:var(--ivory); letter-spacing:.02em; margin-top:.4cqmin;
    opacity:.95;
  }

  /* ---------- brand footer ---------- */
  .brand{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:1.2cqmin; margin-top:3.4cqmin;}
  .divider{display:flex; align-items:center; gap:1.6cqmin; color:var(--gold-bright);}
  .divider .line{width:14cqmin; height:0.28cqmin; background:linear-gradient(90deg,rgba(255,211,78,0),var(--gold-bright));}
  .divider .line.r{background:linear-gradient(90deg,var(--gold-bright),rgba(255,211,78,0));}
  .divider .dot{width:1.4cqmin; height:1.4cqmin; background:var(--gold-bright); transform:rotate(45deg); box-shadow:0 0 0 0.4cqmin rgba(255,211,78,.18);}
  .company{font-size:3.5cqmin; letter-spacing:.42em; text-indent:.42em; font-weight:700; color:var(--gold-hi);}
  .url{font-size:2.3cqmin; letter-spacing:.28em; text-indent:.28em; color:rgba(242,231,206,.72);}

  /* export caption (not part of poster) */
  .caption{color:#c9a68f; font-size:13px; letter-spacing:.02em; text-align:center; max-width:var(--stage); line-height:1.5;}
  .caption b{color:#f0d3b6; font-weight:600;}

  @media (prefers-reduced-motion:reduce){
    .rays,.flag{animation:none;}
  }
</style>

<div class="poster" role="img" aria-label="Happy Rath Yatra greeting from Amex Technology, featuring the Jagannath chariot">
